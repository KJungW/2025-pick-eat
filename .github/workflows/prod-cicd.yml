name: Back-Prod Build and Deploy

#on:
#  push:
#    branches: [ "main" ]

on: [ workflow_dispatch ]

jobs:
  ci:
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_KEY }}
          submodules: recursive

      - name: Update Submodule
        run: git submodule update --remote

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: Build JAR
        working-directory: ./backend
        run: ./gradlew clean build -x test --no-daemon --build-cache

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPOSITORY }}:release
          build-args: |
            SPRING_ACTIVE_PROFILE=prod

  migrate:
    needs: ci
    runs-on: [ self-hosted, migrator ]
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_KEY }}
          submodules: true

      - name: Run Storage Migration
        run: |
          SCRIPT_DIR="./backend/src/main/resources/storage/migration"
          
          for script in $(ls $SCRIPT_DIR/*.lua 2>/dev/null | sort -t'V' -k2 -n); do
            echo "🛠️ 실행: $script"
            redis-cli -h ${{ secrets.REDIS_HOST }} -p ${{ secrets.REDIS_PORT }} \
              --eval "$script"
          
            if [ $? -ne 0 ]; then
              echo "❌ 마이그레이션 실패: $script"
              exit 1
            fi
          
            echo "✅ 완료: $script"
          done
          
          echo "✅ 전체 마이그레이션 완료"

  cd:
    needs: migrate
    runs-on: [ self-hosted, prod ]
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_KEY }}
          submodules: true

      - name: Copy Docker Compose
        run: |
          sudo cp ./backend/docker/docker-compose.prod.yml /home/ubuntu/application/docker-compose.yml

      - name: Run Blue-Green Deploy
        run: |
          if [ -f "/home/ubuntu/deploy.sh" ]; then
            echo "🚀 Running deploy script..."
            sudo chmod +x /home/ubuntu/deploy.sh
            sudo /home/ubuntu/deploy.sh
          else
            echo "❌ deploy.sh not found!"
            exit 1
          fi
